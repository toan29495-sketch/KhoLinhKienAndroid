name: KhoLinhKien stable release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode (must be greater than the installed build)
        required: true
        type: number
        default: 4
      version_name:
        description: Human-readable versionName
        required: true
        type: string
        default: "1.3"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require the isolated release branch
        run: |
          echo "::error::Do not build from main. Select work/step208-completion-build in the Run workflow branch selector."
          exit 1
