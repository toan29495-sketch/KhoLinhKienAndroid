name: KhoLinhKien stable release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode (must be greater than the installed build)
        required: true
        type: number
        default: 4
      version_name:
        description: Human-readable versionName
        required: true
        type: string
        default: "1.3"

permissions:
  contents: read

concurrency:
  group: kho-linh-kien-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated release branch
        uses: actions/checkout@v4

      - name: Validate source and apply current fixes
        run: |
          set -euo pipefail
          test -s Step208-source.zip
          unzip -t Step208-source.zip
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q Step208-source.zip -d "$RUNNER_TEMP/source"
          SOURCE_ROOT="$RUNNER_TEMP/source/KhoLinhKienAndroid"
          test -f "$SOURCE_ROOT/settings.gradle.kts"
          test -f "$SOURCE_ROOT/app/build.gradle.kts"
          cp -a "$SOURCE_ROOT/." "$GITHUB_WORKSPACE/"
          chmod +x ./gradlew
          git apply --check step208-fixes.patch
          git apply step208-fixes.patch
          git apply --check step209-recovery.patch
          git apply step209-recovery.patch
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Configure Supabase values and persistent release signing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing GitHub Actions secret: $name"; exit 1; }
          done
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > local.properties
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          test -s release-key.jks
          keytool -list -keystore release-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Apply release version
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          if code < 4:
              raise SystemExit("versionCode must be >= 4 for the Step209 baseline")
          if not re.fullmatch(r"[0-9]+(?:\\.[0-9A-Za-z-]+)*", name):
              raise SystemExit("Invalid versionName")
          s, n1 = re.subn(r"versionCode\\s*=\\s*\\d+", f"versionCode = {code}", s, count=1)
          s, n2 = re.subn(r'versionName\\s*=\\s*"[^"]+"', f'versionName = "{name}"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not safely update versionCode/versionName")
          p.write_text(s)
          PY

      - name: Validate release source contracts
        run: |
          python -m compileall -q tools
          for f in tools/verify_step{190..208}*.py tools/verify_step114_restore_account_isolation.py tools/verify_step127_photo_retry_idempotency.py tools/verify_step141_restore_remote_contract.py tools/verify_step142_remote_reconciliation.py; do
            test -f "$f" || continue
            python "$f"
          done
          python tools/verify_step209_admin_password_recovery.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: ./gradlew --no-daemon --stacktrace :app:compileReleaseKotlin :app:assembleRelease

      - name: Verify APK signature and calculate checksum
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^package:|^application-label:"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: KhoLinhKien-Stable-Release-v${{ inputs.version_name }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
