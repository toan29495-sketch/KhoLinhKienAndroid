name: KhoLinhKien stable release

on:
  push:
    branches:
      - work/step212-session-expiry-backup
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode (must be greater than the installed build)
        required: true
        type: number
        default: 8
      version_name:
        description: Human-readable versionName
        required: true
        type: string
        default: "1.7"

permissions:
  contents: read

concurrency:
  group: kho-linh-kien-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated release branch
        uses: actions/checkout@v4

      - name: Validate source and apply current fixes
        run: |
          set -euo pipefail
          test -s Step208-source.zip
          unzip -t Step208-source.zip
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q Step208-source.zip -d "$RUNNER_TEMP/source"
          SOURCE_ROOT="$RUNNER_TEMP/source/KhoLinhKienAndroid"
          test -f "$SOURCE_ROOT/settings.gradle.kts"
          test -f "$SOURCE_ROOT/app/build.gradle.kts"
          cp -a "$SOURCE_ROOT/." "$GITHUB_WORKSPACE/"
          chmod +x ./gradlew
          git apply --check step208-fixes.patch
          git apply step208-fixes.patch
          git apply --check step209-recovery.patch
          git apply step209-recovery.patch
          # Apply Step210 recovery and Functions plugin changes directly to the extracted source.
          # This avoids brittle unified-diff context against the packed Step208 baseline.
          python - <<'PY'
          from pathlib import Path
          provider = Path("app/src/main/java/vn/kholinhkien/SupabaseClientProvider.kt")
          source = provider.read_text()
          if "import io.github.jan.supabase.functions.Functions" not in source:
              anchor = "import io.github.jan.supabase.auth.Auth"
              if anchor not in source:
                  raise SystemExit("Could not locate Supabase Auth import")
              source = source.replace(anchor, anchor + "\nimport io.github.jan.supabase.functions.Functions", 1)
          if "import io.github.jan.supabase.auth.FlowType" not in source:
              anchor = "import io.github.jan.supabase.auth.Auth"
              source = source.replace(anchor, "import io.github.jan.supabase.auth.FlowType\n" + anchor, 1)
          if "flowType = FlowType.PKCE" not in source:
              anchor = "install(Auth) {"
              if anchor not in source:
                  raise SystemExit("Could not locate Auth plugin configuration")
              source = source.replace(anchor, anchor + "\n            flowType = FlowType.PKCE", 1)
          if "install(Functions)" not in source:
              anchor = "install(Auth) {"
              end = source.find("\n        }", source.find(anchor))
              if end < 0:
                  raise SystemExit("Could not locate end of Auth plugin configuration")
              source = source[:end + len("\n        }")] + "\n        install(Functions)" + source[end + len("\n        }"):]
          provider.write_text(source)
          verifier = Path("tools/verify_step209_admin_password_recovery.py")
          v = verifier.read_text()
          check = '    "Supabase Functions plugin installed for Admin KTV actions": "import io.github.jan.supabase.functions.Functions" in provider and "install(Functions)" in provider,\n'
          if "Supabase Functions plugin installed for Admin KTV actions" not in v:
              anchor = '    "manifest exposes callback activity":'
              if anchor not in v:
                  raise SystemExit("Could not locate Step209 verifier insertion point")
              v = v.replace(anchor, check + anchor, 1)
          if "FlowType.PKCE" not in v:
              v = v.replace('"auth.importSession(session)" in recovery,', '"auth.importSession(session)" in recovery and "FlowType.PKCE" in provider,', 1)
          verifier.write_text(v)

          # Step211: preserve self-profile visibility during mandatory password change.
          migration_source = Path("step211-profile-forced-change-rls.sql")
          if not migration_source.is_file():
              raise SystemExit("Missing Step211 profile RLS migration")
          migration_dir = Path("supabase/migrations")
          migration_dir.mkdir(parents=True, exist_ok=True)
          migration_target = migration_dir / "20261104180000_step211_allow_self_profile_read_during_forced_password_change.sql"
          migration_target.write_text(migration_source.read_text())

          auth_repo = Path("app/src/main/java/vn/kholinhkien/AuthRepository.kt")
          auth_text = auth_repo.read_text()
          old_profile_query = (
              '        val profile = client.from("profiles").select {\n'
              '            filter { eq("id", userId) }\n'
              '        }.decodeSingle<UserProfile>()'
          )
          new_profile_query = (
              '        val profiles = client.from("profiles").select {\n'
              '            filter { eq("id", userId) }\n'
              '        }.decodeList<UserProfile>()\n'
              '        val profile = profiles.firstOrNull()\n'
              '            ?: throw IllegalStateException("Không thể tải hồ sơ tài khoản. Hãy kiểm tra quyền đọc hồ sơ hoặc liên hệ Admin.")'
          )
          if old_profile_query in auth_text:
              auth_text = auth_text.replace(old_profile_query, new_profile_query, 1)
          elif "Không thể tải hồ sơ tài khoản." not in auth_text:
              raise SystemExit("Could not locate getCurrentProfile query for safe empty-result handling")
          auth_repo.write_text(auth_text)

          verifier = Path("tools/verify_step209_admin_password_recovery.py")
          v = verifier.read_text()
          if "forced-password profile RLS migration is present" not in v:
              anchor = "for label, passed in checks.items():"
              extra = (
                  'checks["forced-password profile RLS migration is present"] = (root / "supabase/migrations/20261104180000_step211_allow_self_profile_read_during_forced_password_change.sql").is_file()\n'
                  'checks["empty profile result has actionable message"] = "Không thể tải hồ sơ tài khoản." in auth\n'
              )
              if anchor not in v:
                  raise SystemExit("Could not locate Step209 verifier result loop")
              v = v.replace(anchor, extra + anchor, 1)
          verifier.write_text(v)
          PY
          python step212-session-expiry-backup.py
          python step213-qr-routing-and-camera-guard.py
          python step214-direct-qr-type-routing.py
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Configure Supabase values and persistent release signing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing GitHub Actions secret: $name"; exit 1; }
          done
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > local.properties
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          test -s release-key.jks
          keytool -list -keystore release-key.jks -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
          python - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          marker = "android {"
          signing = '''
              signingConfigs {
                  create("release") {
                      storeFile = file("../release-key.jks")
                      storePassword = System.getenv("RELEASE_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("RELEASE_KEY_ALIAS")
                      keyPassword = System.getenv("RELEASE_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }
          '''
          if 'create("release")' in s:
              raise SystemExit("Release signing already configured; refusing duplicate insertion")
          if s.count(marker) != 1:
              raise SystemExit("Could not locate unique Android DSL block")
          p.write_text(s.replace(marker, marker + signing, 1))
          PY
          grep -q 'signingConfig = signingConfigs.getByName("release")' app/build.gradle.kts

      - name: Apply release version
        env:
          VERSION_CODE: ${{ inputs.version_code || '8' }}
          VERSION_NAME: ${{ inputs.version_name || '1.7' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          code = int(os.environ["VERSION_CODE"])
          name = os.environ["VERSION_NAME"]
          if code < 4:
              raise SystemExit("versionCode must be >= 4 for the Step209 baseline")
          if not re.fullmatch(r"[0-9]+(?:\.[0-9A-Za-z-]+)*", name):
              raise SystemExit("Invalid versionName")
          s, n1 = re.subn(r"versionCode\s*=\s*\d+", f"versionCode = {code}", s, count=1)
          s, n2 = re.subn(r'versionName\s*=\s*"[^"]+"', f'versionName = "{name}"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not safely update versionCode/versionName")
          p.write_text(s)
          PY

      - name: Validate release source contracts
        run: |
          python -m compileall -q tools
          for f in tools/verify_step{190..208}*.py tools/verify_step114_restore_account_isolation.py tools/verify_step127_photo_retry_idempotency.py tools/verify_step141_restore_remote_contract.py tools/verify_step142_remote_reconciliation.py; do
            test -f "$f" || continue
            python "$f"
          done
          python tools/verify_step209_admin_password_recovery.py
          python tools/verify_step212_session_expiry_backup.py
          python tools/verify_step213_qr_routing_and_camera_guard.py
          python tools/verify_step214_direct_qr_type_routing.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:compileReleaseKotlin :app:assembleRelease

      - name: Verify APK signature and calculate checksum
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^package:|^application-label:"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: KhoLinhKien-Stable-Release-v${{ inputs.version_name }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
