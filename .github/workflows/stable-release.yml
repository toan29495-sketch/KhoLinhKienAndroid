name: KhoLinhKien stable release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch for release build
        required: true
        type: string
        default: work/step208-completion-build
      version_code:
        description: Android versionCode
        required: true
        type: number
        default: 6
      version_name:
        description: Android versionName
        required: true
        type: string
        default: "1.5"

permissions:
  contents: read

jobs:
  dispatch_check:
    name: Verify release dispatch configuration
    runs-on: ubuntu-latest
    steps:
      - name: Confirm selected release source
        run: |
          echo "Release source: ${{ inputs.source_branch }}"
          echo "Version code: ${{ inputs.version_code }}"
          echo "Version name: ${{ inputs.version_name }}"
          test "${{ inputs.source_branch }}" = "work/step208-completion-build"
