name: Inspect outbox sender source
on:
  push:
    branches:
      - inspect/outbox-sender-source
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract sync DAO and worker source
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('Step208-source.zip')
          wanted=('InventoryDao.kt','SyncWorkScheduler.kt','SyncWorker.kt','InventorySyncWorker.kt','SyncOutboxWorker.kt','MainActivity.kt')
          for name in z.namelist():
              if name.split('/')[-1] in wanted:
                  data=z.read(name).decode('utf-8')
                  print('FILE_BEGIN:',name)
                  for i,line in enumerate(data.splitlines(),1):
                      print(f'{i}: {line}')
                  print('FILE_END:',name)
          PY
