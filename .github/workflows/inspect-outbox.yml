name: Inspect outbox sender source
on:
  push:
    branches:
      - inspect/outbox-sender-source
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect outbox diagnostics UI
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('Step208-source.zip')
          n=next(x for x in z.namelist() if x.endswith('MainActivity.kt'))
          lines=z.read(n).decode('utf-8').splitlines()
          for a,b in ((450,555),(790,850),(1258,1350)):
              print(f'RANGE {a}-{b}')
              for i in range(a-1,min(b,len(lines))): print(f'{i+1}: {lines[i]}')
          PY
