name: Inspect outbox sender source
on:
  push:
    branches:
      - inspect/outbox-sender-source
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect backup UI sync hooks
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,re
          z=zipfile.ZipFile('Step208-source.zip')
          n=next(x for x in z.namelist() if x.endswith('MainActivity.kt'))
          lines=z.read(n).decode('utf-8').splitlines()
          pats=re.compile(r'Làm mới|SyncWorkScheduler\.schedule|fun Tools|ToolsBackup|pendingOutbox|Đồng bộ|Tổng chưa đồng bộ|FAILED',re.I)
          for i,line in enumerate(lines):
              if pats.search(line):
                  print(f'--- MATCH {i+1} ---')
                  for j in range(max(0,i-10),min(len(lines),i+16)):
                      print(f'{j+1}: {lines[j]}')
          PY
