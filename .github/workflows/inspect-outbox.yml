name: Inspect outbox sender source
on:
  push:
    branches:
      - inspect/outbox-sender-source
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact sync source
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('Step208-source.zip')
          for suffix in ('SyncOutboxSender.kt','SyncWork.kt'):
              n=next(x for x in z.namelist() if x.endswith(suffix))
              print('FILE_BEGIN:',n)
              print(z.read(n).decode('utf-8'))
              print('FILE_END:',n)
          n=next(x for x in z.namelist() if x.endswith('Data.kt'))
          lines=z.read(n).decode('utf-8').splitlines()
          for a,b in ((145,190),(265,305),(735,780)):
              print(f'DATA_LINES_{a}_{b}')
              for i in range(a-1,min(b,len(lines))): print(f'{i+1}: {lines[i]}')
          PY
