name: Inspect restore source safely
on:
  push:
    branches:
      - work/step212-session-expiry-backup
    paths:
      - '.github/workflows/inspect-restore-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect restore implementation from canonical source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q Step208-source.zip -d "$RUNNER_TEMP/src"
          python - <<'PY'
          from pathlib import Path
          root = Path("$RUNNER_TEMP/src")
          files = [p for p in root.rglob("*") if p.is_file() and p.suffix in {".kt", ".java", ".sql"}]
          terms = ("STAGED", "restore-", "part-images", "downloadAuthenticated", "uploadTo", "storage.from", "restore session", "continueRestore", "staging")
          for p in files:
              try: lines = p.read_text(errors="ignore").splitlines()
              except Exception: continue
              hits = [i for i,s in enumerate(lines) if any(t.lower() in s.lower() for t in terms)]
              if hits:
                  print("\\n===== FILE:", p.relative_to(root), "=====")
                  shown=set()
                  for i in hits:
                      for n in range(max(0,i-5), min(len(lines),i+8)):
                          if n not in shown:
                              print(f"{n+1}: {lines[n]}")
                              shown.add(n)
          PY
