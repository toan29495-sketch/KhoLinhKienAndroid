name: Inspect restore source safely
on:
  push:
    branches:
      - work/step212-session-expiry-backup
    paths:
      - '.github/workflows/inspect-restore-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect restore implementation from canonical source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q Step208-source.zip -d "$RUNNER_TEMP/src"
          INSPECT_ROOT="$RUNNER_TEMP/src" python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["INSPECT_ROOT"])
          files = [p for p in root.rglob("*") if p.is_file() and p.suffix in {".kt", ".java", ".sql"}]
          terms = ("STAGED", "restore-", "part-images", "downloadAuthenticated", "uploadTo", "storage.from", "restore session", "continueRestore", "staging")
          targets = {
              "RestorePhotoUploadCoordinator.kt": (68, 180),
              "RestoreCloudPayloadPreparer.kt": (1, 82),
          }
          for p in files:
              if p.name not in targets: continue
              lines = p.read_text(errors="ignore").splitlines()
              start, end = targets[p.name]
              print("\\n===== TARGET:", p.name, "=====")
              for n in range(start-1, min(len(lines), end)):
                  print(f"{n+1}: {lines[n]}")
          PY
