name: Locate restore verifier
on:
  push:
    branches:
      - work/step212-session-expiry-backup
    paths:
      - '.github/workflows/locate-restore-verifier.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find verifier construction
        run: |
          unzip -q Step208-source.zip -d "$RUNNER_TEMP/src"
          python -c "from pathlib import Path; r=Path('$RUNNER_TEMP/src'); terms=('RestorePhotoUploadCoordinator(', 'verifyObject ='); [(print('\nFILE',p),print('\n'.join(f'{i+1}: {s}' for i,s in enumerate(p.read_text(errors='ignore').splitlines()) if any(t in s for t in terms)))) for p in r.rglob('*.kt') if any(t in p.read_text(errors='ignore') for t in terms)]"
