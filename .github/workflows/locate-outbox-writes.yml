name: Locate outbox writes and sync scheduling
on:
  push:
    paths:
      - ".github/workflows/locate-outbox-writes.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search Kotlin call sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q Step208-source.zip -d "$RUNNER_TEMP/src"
          ROOT="$RUNNER_TEMP/src/KhoLinhKienAndroid/app/src/main/java"
          echo "=== ALL KOTLIN PATHS ==="
          find "$ROOT" -type f -name '*.kt' | sort
          echo "=== OUTBOX AND SCHEDULER REFERENCES ==="
          grep -RniE 'pendingOutbox|insert.*Outbox|Outbox.*insert|OutboxEntity|SyncWorkScheduler|SyncOutboxWorker|outboxDao|enqueue.*operation|operation.*enqueue' "$ROOT" || true
